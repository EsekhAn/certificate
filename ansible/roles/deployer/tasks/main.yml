---
- name: Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Pull the application image
  ansible.builtin.command:
    cmd: "docker pull {{ app_image }}"
  register: image_pull
  changed_when: true

- name: Render the docker compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start the application container
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ app_dir }}"
  register: compose_up
  changed_when: true

- name: Wait for the application port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    timeout: 180
    delay: 5

- name: Check that the application responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/hello/"
    status_code: 200
    timeout: 10
  register: app_check
  until: app_check.status == 200
  retries: 12
  delay: 5

- name: Remove unused Docker images on the stage node
  ansible.builtin.command:
    cmd: docker image prune -f
  changed_when: false
