---
- name: Obtain an IAM token from the instance metadata service
  ansible.builtin.uri:
    url: "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token"
    headers:
      Metadata-Flavor: Google
    status_code: 200
    return_content: true
  register: yc_metadata_token
  until: yc_metadata_token.status == 200
  retries: 12
  delay: 5
  no_log: true

- name: Log in to Yandex Container Registry
  ansible.builtin.command:
    cmd: "docker login --username iam --password-stdin {{ registry_host }}"
    stdin: "{{ (yc_metadata_token.content | from_json).access_token }}"
  changed_when: false
  no_log: true
