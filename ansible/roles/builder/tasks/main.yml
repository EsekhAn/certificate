---
- name: Check that the application sources exist on the control node
  ansible.builtin.stat:
    path: "{{ app_source_dir }}/pom.xml"
  delegate_to: localhost
  become: false
  register: app_sources

- name: Fail when the application sources are missing
  ansible.builtin.assert:
    that: app_sources.stat.exists
    fail_msg: "app_source_dir={{ app_source_dir }} does not contain pom.xml"
    quiet: true

- name: Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Copy the application sources to the build node
  ansible.builtin.copy:
    src: "{{ app_source_dir }}/"
    dest: "{{ app_dir }}/"
    directory_mode: "0755"

- name: Build the application image
  ansible.builtin.command:
    cmd: "docker build --provenance=false -t {{ app_image }} ."
    chdir: "{{ app_dir }}"
  register: image_build
  changed_when: true

- name: Push the image to Yandex Container Registry
  ansible.builtin.command:
    cmd: "docker push {{ app_image }}"
  register: image_push
  changed_when: true

- name: Remove unused Docker images on the build node
  ansible.builtin.command:
    cmd: docker image prune -f
  changed_when: false
